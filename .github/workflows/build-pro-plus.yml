name: Build Activity Pro+

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pro-plus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Get patched Media3
        run: git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched

      - name: Build Pro+ APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDefaultProPlus

      - name: Verify APK output
        run: |
          apk="$(find app/build/outputs/apk/default/proPlus -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          permissions="$("$aapt" dump permissions "$apk")"
          if printf '%s\n' "$permissions" | grep -Eq "uses-permission: name='android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)'"; then
            echo "APK unexpectedly declares a network permission" >&2
            exit 1
          fi
          "$aapt" dump badging "$apk" | grep -F "package: name='com.fadcam.proplus'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'Activity'"
          find app/build/outputs/apk/default/proPlus -maxdepth 1 -name '*.apk' -ls

      - name: Upload Pro+ APK
        uses: actions/upload-artifact@v4
        with:
          name: activity-pro-plus-apk
          path: app/build/outputs/apk/default/proPlus/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        run: |
          echo "## Activity Pro+ build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: com.fadcam.proplus" >> "$GITHUB_STEP_SUMMARY"
          echo "- Network permission: none" >> "$GITHUB_STEP_SUMMARY"
          echo "- LAN/cloud streaming: removed" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK artifact: activity-pro-plus-apk" >> "$GITHUB_STEP_SUMMARY"
